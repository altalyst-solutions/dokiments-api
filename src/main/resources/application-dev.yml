# Local development (`./gradlew bootRun` activates this profile).

spring:
  config:
    # Local settings from .env in the project folder (see .env.example), such as PORT, so
    # one file configures both bootRun and Docker Compose. `optional:` means a missing .env
    # is fine, and `[.properties]` tells Spring Boot how to read it. Real environment
    # variables still take precedence over values in the file.
    import: optional:file:.env[.properties]
  main:
    # Spring Boot hides the banner whenever structured logging is configured, which the
    # base application.yml does for production. Locally the logs are plain text, so the
    # banner is safe to show again.
    banner-mode: console
  output:
    ansi:
      # Coloured log levels and logger names. Spring Boot only colours output when it
      # detects a terminal, and output that goes through Gradle (bootRun) doesn't count
      # as one, so it has to be forced here. Never in production, where the escape codes
      # would end up inside the JSON logs.
      enabled: always
  data:
    redis:
      # Local Redis from compose.yaml unless REDIS_URL says otherwise.
      url: ${REDIS_URL:redis://localhost:6379}

dokiments:
  # Always the local emulator from compose.yaml, never a real project: require-emulator makes
  # the application refuse to start otherwise.
  firestore:
    project-id: ${FIREBASE_PROJECT_ID:demo-dokiments}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:localhost:${FIRESTORE_EMULATOR_PORT:8085}}
    require-emulator: true

management:
  endpoint:
    health:
      # Show which dependency is down while developing.
      show-details: always

logging:
  structured:
    format:
      # Plain, human-readable logs locally.
      console: ""
  level:
    com.dokiments: debug
    # The Redis client looks for an optional macOS-native DNS library and warns on every
    # start when it isn't there. It falls back to the standard Java resolver, which works
    # fine, and the warning never appears in the Linux containers we deploy.
    io.netty.resolver.dns.DnsServerAddressStreamProviders: error
