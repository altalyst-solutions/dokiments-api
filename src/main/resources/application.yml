# Base configuration, shared by every environment.
#
# These defaults are production-safe: running without a profile must never be
# less secure than running with `prod`. Developer conveniences live in
# application-dev.yml. Everything environment-specific comes from environment
# variables (12-factor), so the same image runs on any platform.

spring:
  application:
    name: dokiments-api
  threads:
    virtual:
      # Blocking I/O (Firestore, Firebase Auth, Resend) on virtual threads.
      enabled: true
  lifecycle:
    # Upper bound for in-flight requests to finish on shutdown (Cloud Run sends
    # SIGTERM and allows 10 s by default; Docker 10 s).
    timeout-per-shutdown-phase: 9s
  autoconfigure:
    exclude:
      # No in-memory user / generated password: authentication is Firebase-backed.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  data:
    redis:
      # Required. Any Redis provider, e.g. redis://user:pass@host:6379 or rediss:// for TLS.
      url: ${REDIS_URL}
  session:
    # A session is kept in Redis for up to a day after it was last used. It ends one day after sign-in
    # anyway (see auth.domain.AuthSession), however often it is used.
    timeout: 24h
    data:
      redis:
        # Keeps session keys grouped and apart from anything else in the same Redis.
        namespace: dokiments:session
  web:
    error:
      # Never leak internals in error responses. (In Spring Boot 4 these moved here from
      # server.error.*.) The body itself is replaced by ApiErrorAttributes anyway; these keep
      # Spring Boot from even collecting the details.
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
      whitelabel:
        enabled: false

# The application's own settings (see com.dokiments.platform.config.DokimentsProperties).
dokiments:
  features:
    # Sharing documents for signature. Off unless DOCUMENT_SHARING_ENABLED=true.
    document-sharing: ${DOCUMENT_SHARING_ENABLED:false}
    # Which templates each plan may use. On unless TIER_LOCKS_ENABLED=false, which lets every plan use every
    # template; the limit on how many a free account may save applies either way.
    tier-locks: ${TIER_LOCKS_ENABLED:true}
  # Which Firebase Auth to use (see com.dokiments.auth.adapter.out.firebase.FirebaseAuthProperties).
  # The Web API key is required: deployed, sign-in goes to the real Firebase Auth. Locally and in tests,
  # FIREBASE_AUTH_EMULATOR_HOST points at the Auth emulator instead.
  auth:
    api-key: ${FIREBASE_API_KEY:}
    emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
    # Google sign-in's OAuth client. Without both, Google sign-in is off and its start sends people back to the
    # sign-in page. The client must allow SITE_URL/api/auth/google/callback as a redirect URI.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  # Which Firestore to use (see com.dokiments.platform.firestore.FirestoreProperties for the
  # safety rules). The project ID is required: deployed, it is the real Firebase project. The
  # empty default is deliberate: Spring Boot keeps a missing variable as the literal text
  # "${...}", which would look like a project ID, while an empty value is reported clearly.
  firestore:
    project-id: ${FIREBASE_PROJECT_ID:}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:}

  # Transactional email through Resend (see com.dokiments.platform.email.EmailProperties for who
  # receives it). Without RESEND_API_KEY nothing is sent. EMAIL_ALLOW_LIST, comma-separated,
  # limits email to those addresses: for staging. Leave it unset in production.
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:Dokiments <notifications@mail.dokiments.com>}
    reply-to: ${EMAIL_REPLY_TO:}
    allow-list: ${EMAIL_ALLOW_LIST:}
    # The web app, for the links in emails.
    site-url: ${SITE_URL:https://dokiments.com}

# The API's OpenAPI description and Swagger UI. Off here, so deployed services don't publish a
# map of the API; application-dev.yml switches them on. docs/openapi.yaml is the committed copy.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  # The API reads and writes JSON and nothing else (see platform.web.JsonOnlyConfiguration), so the
  # description says application/json instead of */*.
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  # A stable order and layout, so the committed docs/openapi.yaml only changes when the API does.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind Next.js and the platform's load balancer: trust X-Forwarded-* so
  # redirects, cookies and client IPs use the original scheme/host.
  forward-headers-strategy: framework

management:
  # Traces and metrics are exported with OTLP to a collector, configured with the standard
  # OpenTelemetry variables, which Spring Boot reads: OTEL_EXPORTER_OTLP_ENDPOINT (for example
  # http://collector:4318), OTEL_SERVICE_NAME, OTEL_RESOURCE_ATTRIBUTES and OTEL_TRACES_SAMPLER_ARG.
  # Traces are only exported once an endpoint is set.
  otlp:
    metrics:
      export:
        # Metrics would otherwise be pushed to localhost:4318 every minute and log a failure each
        # time. OTEL_METRICS_EXPORTER=otlp switches them on.
        enabled: false
  tracing:
    sampling:
      # One request in ten is kept. Every request still gets a trace ID for its logs and the
      # X-Trace-Id header; OTEL_TRACES_SAMPLER_ARG changes the share.
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      show-details: never
  info:
    java:
      enabled: true
    env:
      enabled: false

logging:
  structured:
    format:
      # One JSON object per line on stdout (Elastic Common Schema), readable by
      # any log platform.
      console: ecs
    json:
      rename:
        # The trace of the request a line belongs to, under the names ECS defines, so log
        # platforms can link log lines and traces. It is also in the X-Trace-Id response header.
        traceId: trace.id
        spanId: span.id
