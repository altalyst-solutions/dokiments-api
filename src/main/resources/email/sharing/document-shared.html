<!DOCTYPE html>
<!--/*
  Sent to the recipient when a document is shared with them for signature, or shared again after changes.

  Values: senderName and documentName (already cleaned with EmailLabels), updated (true when shared again) and url
  (the web app's "Shared with me" page).
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:remove="tag">
<!--/*@thymesVar id="updated" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="senderName" type="java.lang.String"*/-->
<!--/*@thymesVar id="documentName" type="java.lang.String"*/-->
<!--/*@thymesVar id="url" type="java.lang.String"*/-->
<!--/*@thymesVar id="siteName" type="java.lang.String"*/-->
<th:block th:replace="~{layout.html :: email(
    heading=${updated ? senderName + ' updated a shared document' : senderName + ' shared a document with you'},
    content=~{::content},
    actionLabel='Open document',
    actionUrl=${url})}"/>
<!--/* The email's own content, which the layout inserts. Not output here. */-->
<th:block th:remove="all">
<div th:fragment="content">
  <p style="margin:0 0 16px;" th:if="${updated}"
     th:text="|${senderName} made changes to &quot;${documentName}&quot;. Open it to review the latest version and sign.|">
    Jane made changes to "Service agreement". Open it to review the latest version and sign.
  </p>
  <p style="margin:0 0 16px;" th:unless="${updated}"
     th:text="|${senderName} shared &quot;${documentName}&quot; with you on ${siteName} for your signature.|">
    Jane shared "Service agreement" with you on Dokiments for your signature.
  </p>
  <p style="margin:0 0 16px;"
     th:text="|New to ${siteName}? Create an account with this email address and the document will be waiting under Shared with me.|">
    New to Dokiments? Create an account with this email address and the document will be waiting under Shared with me.
  </p>
</div>
</th:block>
</html>
