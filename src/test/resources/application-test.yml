# Integration tests (see com.dokiments.support.IntegrationTest).

spring:
  data:
    redis:
      # The base config requires REDIS_URL. Tests get Redis from Testcontainers through
      # @ServiceConnection, which takes precedence over this placeholder value.
      url: redis://overridden-by-testcontainers:6379

dokiments:
  # The emulator hosts are set by TestcontainersConfiguration once its container has started.
  auth:
    require-emulator: true
  firestore:
    # The emulator host is set by TestcontainersConfiguration once its container has started.
    project-id: demo-dokiments
    require-emulator: true
  # Tests never send real email: no Resend key, and recipients restricted in case one is set.
  email:
    resend-api-key: ""
    restrict-recipients: true
