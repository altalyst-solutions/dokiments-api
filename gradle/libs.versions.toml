# Single source of truth for dependency and plugin versions.
#
# Libraries managed by Spring Boot's BOM (starters, Testcontainers, JUnit, Jackson…)
# are declared without a version: Boot picks one that is tested to work with it.
# Only libraries Boot does not manage carry a version here.

[versions]
spring-boot = "4.1.2"
spring-modulith = "2.1.2"
firebase-admin = "9.11.0"
archunit = "1.5.1"

# Code quality tooling
spotless = "8.11.0"
palantir-java-format = "2.103.0"
errorprone-plugin = "5.2.0"
errorprone = "2.52.0"
nullaway = "0.14.3"
jacoco = "0.8.16"

# Security overrides: newer than the versions the Spring Boot and Google BOMs pick, because
# those have known vulnerabilities. Remove an entry once the BOMs ship the fixed version.
guava = "33.8.0-jre"
opentelemetry = "1.68.0"
# Used only by the Gradle build itself (through the Spring Boot plugin), never shipped.
commons-lang3 = "3.21.0"

[libraries]
# BOMs
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

# Spring Boot starters (versions from the Boot BOM)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-session-data-redis = { module = "org.springframework.boot:spring-boot-starter-session-data-redis" }
spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# Email templates (version from the Boot BOM)
thymeleaf-spring6 = { module = "org.thymeleaf:thymeleaf-spring6" }

# Spring Modulith (versions from the Modulith BOM)
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# Google / Firebase
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }

# Testing
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-gcloud = { module = "org.testcontainers:testcontainers-gcloud" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Code quality (compile-time only)
jspecify = { module = "org.jspecify:jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
