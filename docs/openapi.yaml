      summary: List the redeemed promo codes
      tags:
      - Promo codes
    post:
      description: "At most once per account. Matching ignores case and spaces. The\
        \ redemption keeps the promotion's own code, not what was typed."
      operationId: redeemPromoCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionEnvelope"
          description: Redeemed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A code that matches no promotion (\"Invalid promo code.\"\
            ), or an invalid body"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Redeemed already ("This promo code has already been used for
            your account.")
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Redeem a promo code
      tags:
      - Promo codes
  /api/saved-templates:
    get:
      description: "Each with its template from the catalog, in the order of their\
        \ template IDs. A saved template whose template is no longer in the catalog\
        \ is left out."
      operationId: listSavedTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTemplatesResponse"
          description: "The saved templates, an empty list for a user who has none"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: List the saved templates
      tags:
      - Saved templates
    post:
      description: "Adds a template of the catalog to the library. Saving one that\
        \ is saved already answers 200 and only updates savedAt. The plan decides\
        \ which templates may be saved, and a free account keeps at most two."
      operationId: saveTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
          description: Saved already; savedAt updated
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
          description: Added
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not in the plan (\"Your plan does not include this template.\"\
            ), or a free account at its limit (\"You've reached your saved template\
            \ limit.\")"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not in the catalog ("Template not found.")
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Save a template
      tags:
      - Saved templates
  /api/saved-templates/{templateId}:
    delete:
      description: Also 204 when it isn't saved.
      operationId: removeSavedTemplate
      parameters:
      - in: path
        name: templateId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Removed, or not there"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Remove a saved template
      tags:
      - Saved templates
  /api/shared-invites/{token}:
    get:
      description: "Public: whoever has the link may see what it leads to, signed\
        \ in or not. state is valid, with the invitation, or expired (after 14 days)\
        \ or invalid, without it. Never cached."
      operationId: previewInvite
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreviewResponse"
          description: What the link leads to
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Sharing is off ("Not found.")
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Preview an invitation
      tags:
      - Invitations
  /api/shared-invites/{token}/accept:
    post:
      description: "Links the signed-in account to the shared copy, when its address\
        \ is the invited one, and answers the copy's ID to open. An account that can\
        \ open the copy already is sent straight to it."
      operationId: acceptInvite
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInviteResponse"
          description: Linked
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Another address (\"This invitation was sent to a different\
            \ email address.\"), with invitedEmail, the invited address masked, such\
            \ as j***@example.com"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A link that doesn't work, or no longer applies (\"This invitation\
            \ is no longer valid.\"), or sharing is off"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: More than 14 days old ("This invitation has expired.")
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Accept an invitation
      tags:
      - Invitations
  /api/templates:
    get:
      description: "Every active style, unfiltered, for the style tabs, and the active\
        \ templates, optionally only those of one style or tier. Both in their intended\
        \ order."
      operationId: listTemplates
      parameters:
      - description: Only templates in this style. The styles list stays complete.
        in: query
        name: styleId
        required: false
        schema:
          type: string
          enum:
          - classic
          - modern
          - brutalist
          - minimalist
      - description: Only templates of this tier. The styles list stays complete.
        in: query
        name: tier
        required: false
        schema:
          type: string
          enum:
          - free
          - silver
          - gold
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
          description: "The styles and templates. Only templates is filtered: styles\
            \ always lists every active style, whatever the filter, because the web\
            \ app shows them all as tabs."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unknown style or tier ("Invalid query parameters.")
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: List the catalog
      tags:
      - Templates
  /api/templates/{id}:
    get:
      description: "One template of the catalog, with its style, to resolve the template\
        \ of a saved template or a document."
      operationId: getTemplate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateEnvelope"
          description: The template
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not in the catalog, or hidden (\"Template not found.\")"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Get a template
      tags:
      - Templates
components:
  schemas:
    AcceptedInviteResponse:
      type: object
      properties:
        sharedDocumentId:
          type: string
    ActionResponse:
      type: object
      properties:
        href:
          type: string
          example: /marketplace
        label:
          type: string
    AuthResponse:
      type: object
      properties:
        promo:
          type: string
          description: What happened to the promo code given with signing up or in;
            left out when none was given
          enum:
          - applied
          - already_redeemed
          - invalid
          - failed
        user:
          $ref: "#/components/schemas/AuthUserResponse"
    AuthUserResponse:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        businessEmail:
          type: string
        companyName:
          type: string
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          description: Whether Firebase has confirmed the address.
        fullName:
          type: string
        linkedGoogle:
          type: boolean
        phone:
          type: string
        provider:
          type: string
          enum:
          - password
          - google
        role:
          type: string
          enum:
          - superadmin
          - free
          - silver
          - gold
          - special
        tel:
          type: string
        uid:
          type: string
        website:
          type: string
    CatalogResponse:
      type: object
      properties:
        styles:
          type: array
          description: "Every active style, in order. Never filtered: the web app\
            \ shows them all as tabs."
          items:
            $ref: "#/components/schemas/StyleResponse"
        templates:
          type: array
          description: "The active templates matching styleId and tier, in order.\
            \ All of them without a filter."
          items:
            $ref: "#/components/schemas/TemplateResponse"
    ClientChangesRequest:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        companyName:
          type: string
        email:
          type: string
        name:
          type: string
        nationalId:
          type: string
        phone:
          type: string
    ClientEnvelope:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/ClientResponse"
    ClientResponse:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        companyName:
          type: string
        createdAt:
          type: integer
          format: int64
        email:
          type: string
        id:
          type: string
          example: client_mhx2k1q8_4f9a2c
        name:
          type: string
        nationalId:
          type: string
        phone:
          type: string
        updatedAt:
          type: integer
          format: int64
    ClientsResponse:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientResponse"
    DocumentChangesRequest:
      type: object
      properties:
        name:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
    DocumentEnvelope:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/DocumentResponse"
    DocumentResponse:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
        id:
          type: string
          example: doc_mhx2k1q8_4f9a2c
        name:
          type: string
        templateId:
          type: string
          example: classic-invoice
        templateSnapshot:
          $ref: "#/components/schemas/SnapshotResponse"
        updatedAt:
          type: integer
          format: int64
        values:
          type: object
          additionalProperties:
            type: string
    DocumentsResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentResponse"
    DuplicateRequest:
      type: object
      properties:
        name:
          type: string
          example: Invoice for Acme (copy)
        values:
          type: object
          additionalProperties:
            type: string
      required:
      - name
      - values
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          example: jane@example.com
      required:
      - email
    Error:
      type: object
      additionalProperties:
        type: string
      description: The body of every error response.
      properties:
        code:
          type: string
          description: "Only for failures the web app handles in code, such as REAUTH_REQUIRED."
        error:
          type: string
          description: A message safe to show to the user.
      required:
      - error
    FeedbackEnvelope:
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/FeedbackResponse"
    FeedbackRequest:
      type: object
      properties:
        message:
          type: string
          example: The export button does nothing.
        path:
          type: string
          example: /my-documents
        type:
          type: string
          enum:
          - feedback
          - problem
      required:
      - message
      - type
    FeedbackResponse:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
          example: feedback_mhx2k1q8_4f9a2c
        message:
          type: string
        path:
          type: string
        type:
          type: string
          enum:
          - feedback
          - problem
        uid:
          type: string
    FieldResponse:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        placeholder:
          type: string
        type:
          type: string
          example: text
    InvitePreviewResponse:
      type: object
      properties:
        invite:
          $ref: "#/components/schemas/InviteSummary"
        state:
          type: string
          enum:
          - valid
          - expired
          - invalid
    InviteSummary:
      type: object
      properties:
        name:
          type: string
        ownerEmail:
          type: string
        ownerName:
          type: string
        signable:
          type: boolean
    LedgerEntryResponse:
      type: object
      properties:
        email:
          type: string
        firstSharedAt:
          type: integer
          format: int64
        lastSharedAt:
          type: integer
          format: int64
    LedgerResponse:
      type: object
      properties:
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntryResponse"
    NewClientRequest:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        companyName:
          type: string
          example: Acme Ltd
        email:
          type: string
          example: jane@acme.example
        name:
          type: string
          example: Jane Doe
        nationalId:
          type: string
        phone:
          type: string
          example: +230 5123 4567
      required:
      - companyName
      - email
      - name
      - phone
    NewDocumentRequest:
      type: object
      properties:
        name:
          type: string
          example: Invoice for Acme
        templateId:
          type: string
          example: classic-invoice
          minLength: 1
        values:
          type: object
          additionalProperties:
            type: string
      required:
      - name
      - templateId
      - values
    NotificationResponse:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/ActionResponse"
        body:
          type: string
        createdAt:
          type: integer
          format: int64
        id:
          type: string
          example: template:classic-invoice
        kind:
          type: string
          example: template
        read:
          type: boolean
        title:
          type: string
    NotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    PasswordRequest:
      type: object
      properties:
        password:
          type: string
    ProfileRequest:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        businessEmail:
          type: string
        companyName:
          type: string
        displayName:
          type: string
          example: Jane Doe
        fullName:
          type: string
        phone:
          type: string
        tel:
          type: string
        website:
          type: string
      required:
      - displayName
    RedeemRequest:
      type: object
      properties:
        promoCode:
          type: string
          example: ViSHDOK2026!
          maxLength: 64
          minLength: 0
      required:
      - promoCode
    RedemptionEnvelope:
      type: object
      properties:
        redemption:
          $ref: "#/components/schemas/RedemptionResponse"
    RedemptionResponse:
      type: object
      properties:
        code:
          type: string
        promoId:
          type: string
          example: launch-2026
        redeemedAt:
          type: integer
          format: int64
    RedemptionsResponse:
      type: object
      properties:
        redemptions:
          type: array
          items:
            $ref: "#/components/schemas/RedemptionResponse"
    SaveRequest:
      type: object
      properties:
        templateId:
          type: string
          example: classic-invoice
          minLength: 1
      required:
      - templateId
    SavedResponse:
      type: object
      properties:
        savedAt:
          type: integer
          format: int64
        savedId:
          type: string
        templateId:
          type: string
    SavedTemplateEntry:
      type: object
      properties:
        savedAt:
          type: integer
          format: int64
        template:
          $ref: "#/components/schemas/TemplateResponse"
        templateId:
          type: string
    SavedTemplatesResponse:
      type: object
      properties:
        savedTemplates:
          type: array
          items:
            $ref: "#/components/schemas/SavedTemplateEntry"
    SeenResponse:
      type: object
      properties:
        lastSeenAt:
          type: integer
          format: int64
    ShareRequestBody:
      type: object
      properties:
        email:
          type: string
          example: client@acme.example
    ShareResponse:
      type: object
      properties:
        recipient:
          $ref: "#/components/schemas/SharedWith"
        sharedDocumentId:
          type: string
    SharedDocumentEnvelope:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/SharedDocumentResponse"
    SharedDocumentResponse:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
        id:
          type: string
          example: uid123_doc_mhx2k1q8_4f9a2c
        locked:
          type: boolean
        name:
          type: string
        ownerEmail:
          type: string
        ownerId:
          type: string
        ownerName:
          type: string
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/SharedRecipientResponse"
        signatures:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SignatureResponse"
        sourceDocumentId:
          type: string
        templateId:
          type: string
        templateSnapshot:
          $ref: "#/components/schemas/SharedSnapshotResponse"
        updatedAt:
          type: integer
          format: int64
        values:
          type: object
          additionalProperties:
            type: string
        views:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ViewResponse"
    SharedDocumentsResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/SharedDocumentResponse"
    SharedRecipientResponse:
      type: object
      properties:
        email:
          type: string
        emailedAt:
          type: array
          items:
            type: integer
            format: int64
        invitedAt:
          type: integer
          format: int64
        revokedAt:
          type: integer
          format: int64
        signedAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - pending
          - viewed
          - signed
          - revoked
        uid:
          type: string
    SharedSnapshotFieldResponse:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        placeholder:
          type: string
        type:
          type: string
    SharedSnapshotResponse:
      type: object
      properties:
        description:
          type: string
        documentType:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SharedSnapshotFieldResponse"
        name:
          type: string
        style:
          $ref: "#/components/schemas/SharedSnapshotStyleResponse"
    SharedSnapshotStyleResponse:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
        tier:
          type: string
    SharedWith:
      type: object
      properties:
        email:
          type: string
        status:
          type: string
          enum:
          - pending
          - viewed
