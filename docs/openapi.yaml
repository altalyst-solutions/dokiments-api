openapi: 3.1.0
info:
  description: "The backend of the Dokiments web app, which forwards its /api/* requests\
    \ here. Every error answers with { \"error\": \"<message>\" }, a message safe\
    \ to show to the user."
  title: Dokiments API
  version: "1"
servers:
- url: /
paths:
  /api/auth/forgot-password:
    post:
      description: Public. Firebase sends the link to the account with this address.
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
          description: Sent
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An invalid body, or Firebase refusing, with its message"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Send a password reset link
      tags:
      - Account
  /api/auth/google/callback:
    get:
      description: "Where Google sends the browser back. Starts the session (the dokiments-session\
        \ and dokiments-session-expiry cookies, as for sign-in) and redirects to the\
        \ page asked for at the start. The first Google sign-in creates the account;\
        \ one with the address of a password account signs in to that account. When\
        \ a promo code was given at the start, the page gets ?promo= with what happened\
        \ to it: applied, already_redeemed, invalid or failed."
      operationId: callback
      parameters:
      - in: query
        name: code
        required: false
        schema:
          type: string
          default: ""
      - in: query
        name: state
        required: false
        schema:
          type: string
          default: ""
      - in: query
        name: error
        required: false
        schema:
          type: string
          default: ""
      - in: cookie
        name: dokiments-oauth-state
        required: false
        schema:
          type: string
          default: ""
      responses:
        "302":
          description: "To the page asked for, or to /sign-in?error=google_failed\
            \ when anything went wrong"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Finish signing in with Google
      tags:
      - Google sign-in
  /api/auth/google/start:
    get:
      description: "Redirects to Google's sign-in page. next is where to land afterwards,\
        \ a path on this site (the dashboard otherwise). A promo code is kept with\
        \ the sign-in and redeemed once it completes."
      operationId: start
      parameters:
      - description: "Where to land afterwards, for example /my-documents"
        in: query
        name: next
        required: false
        schema:
          type: string
          default: ""
      - description: A promo code typed on the sign-in page
        in: query
        name: promoCode
        required: false
        schema:
          type: string
          default: ""
      responses:
        "302":
          description: "To Google, or to /sign-in?error=google_failed when Google\
            \ sign-in isn't set up"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Start signing in with Google
      tags:
      - Google sign-in
  /api/auth/me:
    get:
      description: The web app calls this when it starts. The ID token is refreshed
        first when it is about to run out.
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Signed in
        "401":
          content:
            application/json:
              schema:
                type: "null"
          description: "Not signed in, or the session has ended. The body is null,\
            \ as the web app expects."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Who is signed in
      tags:
      - Auth
  /api/auth/reauthenticate:
    post:
      description: "Signs in again with the session's own address and the password\
        \ sent, so a change that needs a recent sign-in can go ahead. The session\
        \ keeps its end."
      operationId: reauthenticate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
          description: Confirmed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A Google account, an invalid body, or a wrong password (\"\
            The email or password is incorrect.\")"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Confirm the current password
      tags:
      - Account
  /api/auth/refresh-verification:
    post:
      description: "Refreshes the session's tokens now, so the user's emailVerified\
        \ reflects a verification link opened in the meantime. A refresh token Firebase\
        \ refuses ends the session (401)."
      operationId: refreshVerification
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: "The user, as of the new tokens"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Pick up a verified address
      tags:
      - Account
  /api/auth/send-verification:
    post:
      description: Nothing is sent when the address is verified already. The answer
        has no body either way.
      operationId: sendVerification
      responses:
        "204":
          description: "Sent, or not needed"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Firebase is throttling the account: \"Too many attempts. Please\
            \ try again later.\""
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Send the verification email again
      tags:
      - Account
  /api/auth/sign-in:
    post:
      description: "Checks the email address and password with Firebase and starts\
        \ a session, as for sign-up. The password has no maximum length. A promo code\
        \ is redeemed once the password is accepted, as for sign-up."
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Signed in
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Firebase refused, with a message for the user, such as \"\
            The email or password is incorrect.\" or \"Too many attempts. Please try\
            \ again later.\""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Sign in
      tags:
      - Auth
  /api/auth/sign-out:
    post:
      description: "Ends the session and expires both session cookies. Always succeeds,\
        \ also when not signed in."
      operationId: signOut
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Sign out
      tags:
      - Auth
  /api/auth/sign-up:
    post:
      description: "Creates the Firebase account and its profile (role free), asks\
        \ Firebase to send a verification email, and starts a session: the dokiments-session\
        \ cookie, and the readable dokiments-session-expiry cookie with the session's\
        \ end in milliseconds. A promo code is redeemed once the account exists, and\
        \ promo says what happened; a promo problem never fails the sign-up."
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Signed up and signed in
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Firebase refused, with a message for the user, such as \"\
            An account already exists for this email.\" or \"Use a stronger password\
            \ with at least 6 characters.\""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Create an account and sign in
      tags:
      - Auth
  /api/auth/update-password:
    post:
      description: "The new password is at most 128 characters; Firebase judges whether\
        \ it is strong enough. When the session is too old for a password change,\
        \ the answer is 403 with the code REAUTH_REQUIRED: confirm the current password\
        \ with /api/auth/reauthenticate, then try again."
      operationId: updatePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A Google account (\"This account signs in with Google — there\
            \ is no password to change.\"), an invalid body, or Firebase refusing,\
            \ with its message"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "REAUTH_REQUIRED, or a missing CSRF token"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Change the password
      tags:
      - Account
  /api/auth/update-profile:
    post:
      description: "Every field is trimmed; a missing one counts as empty, which clears\
        \ it. The answer has the user as changed, with empty details as empty text."
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An invalid body, or Firebase refusing, with its message"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Change the name and details in the settings
      tags:
      - Account
  /api/clients:
    get:
      description: "The signed-in user's clients, the most recently added first."
      operationId: list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientsResponse"
          description: "The clients, an empty list for a user who has none"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: List the clients
      tags:
      - Clients
    post:
      description: "Every field is trimmed. The name, company name, email and phone\
        \ are required; a missing address, BRN or national ID is stored as empty text."
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewClientRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEnvelope"
          description: "Added, with its new ID"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Add a client
      tags:
      - Clients
  /api/clients/{clientId}:
    delete:
      description: Also 204 when there is no such client. Documents already prepared
        for the client keep its details.
      operationId: remove
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Removed, or not there"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Remove a client
      tags:
      - Clients
    patch:
      description: Only the fields sent change; at least one is needed. They follow
        the same rules as for a new client. The answer is the whole client as changed.
      operationId: change
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientChangesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEnvelope"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such client among the user's own ("Client not found.")
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Change a client
      tags:
      - Clients
  /api/documents:
    get:
      description: "The signed-in user's documents, in the order of their IDs, optionally\
        \ only those made from one template."
      operationId: listDocuments
      parameters:
      - description: "Only documents made from this template, such as classic-invoice"
        in: query
        name: templateId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
          description: "The documents, an empty list for a user who has none"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An empty templateId ("Invalid query parameters.")
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: List the documents
      tags:
      - Documents
    post:
      description: "From a template of the catalog. The document keeps a copy of the\
        \ template as it is now (templateSnapshot), so later changes to the catalog\
