openapi: 3.1.0
info:
  description: "The backend of the Dokiments web app, which forwards its /api/* requests\
    \ here. Every error answers with { \"error\": \"<message>\" }, a message safe\
    \ to show to the user."
  title: Dokiments API
  version: "1"
servers:
- url: /
paths:
  /api/auth/forgot-password:
    post:
      description: Public. Firebase sends the link to the account with this address.
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
          description: Sent
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An invalid body, or Firebase refusing, with its message"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Send a password reset link
      tags:
      - Account
  /api/auth/google/callback:
    get:
      description: "Where Google sends the browser back. Starts the session (the dokiments-session\
        \ and dokiments-session-expiry cookies, as for sign-in) and redirects to the\
        \ page asked for at the start. The first Google sign-in creates the account;\
        \ one with the address of a password account signs in to that account."
      operationId: callback
      parameters:
      - in: query
        name: code
        required: false
        schema:
          type: string
          default: ""
      - in: query
        name: state
        required: false
        schema:
          type: string
          default: ""
      - in: query
        name: error
        required: false
        schema:
          type: string
          default: ""
      - in: cookie
        name: dokiments-oauth-state
        required: false
        schema:
          type: string
          default: ""
      responses:
        "302":
          description: "To the page asked for, or to /sign-in?error=google_failed\
            \ when anything went wrong"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Finish signing in with Google
      tags:
      - Google sign-in
  /api/auth/google/start:
    get:
      description: "Redirects to Google's sign-in page. next is where to land afterwards,\
        \ a path on this site (the dashboard otherwise). The promo code is accepted\
        \ but not redeemed yet."
      operationId: start
      parameters:
      - description: "Where to land afterwards, for example /my-documents"
        in: query
        name: next
        required: false
        schema:
          type: string
          default: ""
      responses:
        "302":
          description: "To Google, or to /sign-in?error=google_failed when Google\
            \ sign-in isn't set up"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Start signing in with Google
      tags:
      - Google sign-in
  /api/auth/me:
    get:
      description: The web app calls this when it starts. The ID token is refreshed
        first when it is about to run out.
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Signed in
        "401":
          content:
            application/json:
              schema:
                type: "null"
          description: "Not signed in, or the session has ended. The body is null,\
            \ as the web app expects."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Who is signed in
      tags:
      - Auth
  /api/auth/reauthenticate:
    post:
      description: "Signs in again with the session's own address and the password\
        \ sent, so a change that needs a recent sign-in can go ahead. The session\
        \ keeps its end."
      operationId: reauthenticate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
          description: Confirmed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A Google account, an invalid body, or a wrong password (\"\
            The email or password is incorrect.\")"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Confirm the current password
      tags:
      - Account
  /api/auth/refresh-verification:
    post:
      description: "Refreshes the session's tokens now, so the user's emailVerified\
        \ reflects a verification link opened in the meantime. A refresh token Firebase\
        \ refuses ends the session (401)."
      operationId: refreshVerification
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: "The user, as of the new tokens"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Pick up a verified address
      tags:
      - Account
  /api/auth/send-verification:
    post:
      description: Nothing is sent when the address is verified already. The answer
        has no body either way.
      operationId: sendVerification
      responses:
        "204":
          description: "Sent, or not needed"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Firebase is throttling the account: \"Too many attempts. Please\
            \ try again later.\""
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Send the verification email again
      tags:
      - Account
  /api/auth/sign-in:
    post:
      description: "Checks the email address and password with Firebase and starts\
        \ a session, as for sign-up. The password has no maximum length. The promo\
        \ code is accepted but not redeemed yet."
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Signed in
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Firebase refused, with a message for the user, such as \"\
            The email or password is incorrect.\" or \"Too many attempts. Please try\
            \ again later.\""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Sign in
      tags:
      - Auth
  /api/auth/sign-out:
    post:
      description: "Ends the session and expires both session cookies. Always succeeds,\
        \ also when not signed in."
      operationId: signOut
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Sign out
      tags:
      - Auth
  /api/auth/sign-up:
    post:
      description: "Creates the Firebase account and its profile (role free), asks\
        \ Firebase to send a verification email, and starts a session: the dokiments-session\
        \ cookie, and the readable dokiments-session-expiry cookie with the session's\
        \ end in milliseconds. The promo code is accepted but not redeemed yet."
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Signed up and signed in
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Firebase refused, with a message for the user, such as \"\
            An account already exists for this email.\" or \"Use a stronger password\
            \ with at least 6 characters.\""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Create an account and sign in
      tags:
      - Auth
  /api/auth/update-password:
    post:
      description: "The new password is at most 128 characters; Firebase judges whether\
        \ it is strong enough. When the session is too old for a password change,\
        \ the answer is 403 with the code REAUTH_REQUIRED: confirm the current password\
        \ with /api/auth/reauthenticate, then try again."
      operationId: updatePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A Google account (\"This account signs in with Google — there\
            \ is no password to change.\"), an invalid body, or Firebase refusing,\
            \ with its message"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "REAUTH_REQUIRED, or a missing CSRF token"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Change the password
      tags:
      - Account
  /api/auth/update-profile:
    post:
      description: "Every field is trimmed; a missing one counts as empty, which clears\
        \ it. The answer has the user as changed, with empty details as empty text."
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An invalid body, or Firebase refusing, with its message"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Change the name and details in the settings
      tags:
      - Account
  /api/clients:
    get:
      description: "The signed-in user's clients, the most recently added first."
      operationId: list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientsResponse"
          description: "The clients, an empty list for a user who has none"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: List the clients
      tags:
      - Clients
    post:
      description: "Every field is trimmed. The name, company name, email and phone\
        \ are required; a missing address, BRN or national ID is stored as empty text."
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewClientRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEnvelope"
          description: "Added, with its new ID"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Add a client
      tags:
      - Clients
  /api/clients/{clientId}:
    delete:
      description: Also 204 when there is no such client. Documents already prepared
        for the client keep its details.
      operationId: remove
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Removed, or not there"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Remove a client
      tags:
      - Clients
    patch:
      description: Only the fields sent change; at least one is needed. They follow
        the same rules as for a new client. The answer is the whole client as changed.
      operationId: change
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientChangesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEnvelope"
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such client among the user's own ("Client not found.")
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Change a client
      tags:
      - Clients
  /api/newsletter:
    post:
      description: "Public: no session needed. The address is trimmed and lower-cased;\
        \ subscribing again with the same address keeps one subscription, and the\
        \ answer is the same either way."
      operationId: subscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Subscribe to the newsletter
      tags:
      - Newsletter
  /api/saved-templates:
    get:
      description: "Each with its template from the catalog, in the order of their\
        \ template IDs. A saved template whose template is no longer in the catalog\
        \ is left out."
      operationId: listSavedTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTemplatesResponse"
          description: "The saved templates, an empty list for a user who has none"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: List the saved templates
      tags:
      - Saved templates
    post:
      description: "Adds a template of the catalog to the library. Saving one that\
        \ is saved already answers 200 and only updates savedAt. The plan decides\
        \ which templates may be saved, and a free account keeps at most two."
      operationId: saveTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
          description: Saved already; savedAt updated
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
          description: Added
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The body isn't valid JSON ("Request body must be valid JSON.")
            or doesn't match what the endpoint expects ("Invalid request body.").
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not in the plan (\"Your plan does not include this template.\"\
            ), or a free account at its limit (\"You've reached your saved template\
            \ limit.\")"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not in the catalog ("Template not found.")
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Save a template
      tags:
      - Saved templates
  /api/saved-templates/{templateId}:
    delete:
      description: Also 204 when it isn't saved.
      operationId: removeSavedTemplate
      parameters:
      - in: path
        name: templateId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Removed, or not there"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The CSRF token is missing or wrong: send the value of the\
            \ XSRF-TOKEN cookie in the X-XSRF-TOKEN header (\"Forbidden.\")."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Remove a saved template
      tags:
      - Saved templates
  /api/templates:
    get:
      description: "Every active style, unfiltered, for the style tabs, and the active\
        \ templates, optionally only those of one style or tier. Both in their intended\
        \ order."
      operationId: listTemplates
      parameters:
      - in: query
        name: styleId
        required: false
        schema:
          type: string
          enum:
          - classic
          - modern
          - brutalist
          - minimalist
      - in: query
        name: tier
        required: false
        schema:
          type: string
          enum:
          - free
          - silver
          - gold
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
          description: The styles and templates
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unknown style or tier ("Invalid query parameters.")
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: List the catalog
      tags:
      - Templates
  /api/templates/{id}:
    get:
      description: "One template of the catalog, with its style, to resolve the template\
        \ of a saved template or a document."
      operationId: getTemplate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateEnvelope"
          description: The template
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not signed in
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not in the catalog, or hidden (\"Template not found.\")"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An unexpected failure: \"Something went wrong. Please try\
            \ again.\""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "An external service, such as Firestore, couldn't be reached:\
            \ \"Couldn't reach an external service. Please try again in a moment.\""
      summary: Get a template
      tags:
      - Templates
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUserResponse"
    AuthUserResponse:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        businessEmail:
          type: string
        companyName:
          type: string
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          description: Whether Firebase has confirmed the address.
        fullName:
          type: string
        linkedGoogle:
          type: boolean
        phone:
          type: string
        provider:
          type: string
          enum:
          - password
          - google
        role:
          type: string
          enum:
          - superadmin
          - free
          - silver
          - gold
          - special
        tel:
          type: string
        uid:
          type: string
        website:
          type: string
    CatalogResponse:
      type: object
      properties:
        styles:
          type: array
          items:
            $ref: "#/components/schemas/StyleResponse"
        templates:
          type: array
          items:
            $ref: "#/components/schemas/TemplateResponse"
    ClientChangesRequest:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        companyName:
          type: string
        email:
          type: string
        name:
          type: string
        nationalId:
          type: string
        phone:
          type: string
    ClientEnvelope:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/ClientResponse"
    ClientResponse:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        companyName:
          type: string
        createdAt:
          type: integer
          format: int64
        email:
          type: string
        id:
          type: string
          example: client_mhx2k1q8_4f9a2c
        name:
          type: string
        nationalId:
          type: string
        phone:
          type: string
        updatedAt:
          type: integer
          format: int64
    ClientsResponse:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientResponse"
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          example: jane@example.com
      required:
      - email
    Error:
      type: object
      description: The body of every error response.
      properties:
        code:
          type: string
          description: "Only for failures the web app handles in code, such as REAUTH_REQUIRED."
        error:
          type: string
          description: A message safe to show to the user.
      required:
      - error
    FieldResponse:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        placeholder:
          type: string
        type:
          type: string
          example: text
    NewClientRequest:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        companyName:
          type: string
          example: Acme Ltd
        email:
          type: string
          example: jane@acme.example
        name:
          type: string
          example: Jane Doe
        nationalId:
          type: string
        phone:
          type: string
          example: +230 5123 4567
      required:
      - companyName
      - email
      - name
      - phone
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    PasswordRequest:
      type: object
      properties:
        password:
          type: string
    ProfileRequest:
      type: object
      properties:
        address:
          type: string
        brn:
          type: string
        businessEmail:
          type: string
        companyName:
          type: string
        displayName:
          type: string
          example: Jane Doe
        fullName:
          type: string
        phone:
          type: string
        tel:
          type: string
        website:
          type: string
      required:
      - displayName
    SaveRequest:
      type: object
      properties:
        templateId:
          type: string
          example: classic-invoice
          minLength: 1
      required:
      - templateId
    SavedResponse:
      type: object
      properties:
        savedAt:
          type: integer
          format: int64
        savedId:
          type: string
        templateId:
          type: string
    SavedTemplateEntry:
      type: object
      properties:
        savedAt:
          type: integer
          format: int64
        template:
          $ref: "#/components/schemas/TemplateResponse"
        templateId:
          type: string
    SavedTemplatesResponse:
      type: object
      properties:
        savedTemplates:
          type: array
          items:
            $ref: "#/components/schemas/SavedTemplateEntry"
    SignInRequest:
      type: object
      properties:
        email:
          type: string
          example: jane@example.com
        password:
          type: string
        promoCode:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - email
      - password
    SignOutResponse:
      type: object
      properties:
        ok:
          type: boolean
    SignUpRequest:
      type: object
      properties:
        displayName:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane@example.com
        password:
          type: string
        promoCode:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - displayName
      - email
      - password
    StyleResponse:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
          example: classic
        name:
          type: string
        tier:
          type: string
          enum:
          - free
          - silver
          - gold
    SubscribeRequest:
      type: object
      properties:
        email:
          type: string
          example: jane@example.com
      required:
      - email
    SubscribeResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - subscribed
    TemplateEnvelope:
      type: object
      properties:
        template:
          $ref: "#/components/schemas/TemplateResponse"
    TemplateResponse:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
        description:
          type: string
        documentType:
          type: string
          example: invoice
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldResponse"
        id:
          type: string
          example: classic-invoice
        name:
          type: string
        style:
          $ref: "#/components/schemas/StyleResponse"
        tier:
          type: string
          enum:
          - free
          - silver
          - gold
