# Weekly dependency update pull requests.
#
# Commit messages and pull request titles use Conventional Commits, so Dependabot's pull
# requests pass the commit message check in CI, for example
# "build(deps): bump the gradle-minor-and-patch group with 3 updates".
#
# Minor and patch updates are grouped into one pull request per ecosystem to keep the noise
# down. Major updates come one per pull request, because they are the ones that can need
# code changes.
#
# Dependabot can't see the image tags in src/test/java/com/dokiments/support/TestImages.java.
# When it bumps an image in compose.yaml, TestImagesMatchComposeTest fails until the same
# tag is copied into TestImages.

version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile. The JDK and JRE images are grouped so they are always
  # bumped together and the build and runtime stages stay on the same Java version.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      temurin:
        patterns: ["eclipse-temurin"]
    # The project stays on a long-term-support Java release (currently 25). A new major
    # version such as 26 is often a short-lived, non-LTS release, and moving to the next LTS
    # also means changing the Gradle toolchain, so it is done by hand. Dependabot still
    # brings in the patch updates of the current version.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # The Firebase emulators image used locally and by the integration tests: its Node base
  # image, and the Firebase CLI pinned in its package.json.
  - package-ecosystem: docker
    directory: /docker/firebase-emulators
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    # Node stays on a long-term-support release; moving to the next one is done by hand.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /docker/firebase-emulators
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope

  # Images in compose.yaml (Redis, Jaeger).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
