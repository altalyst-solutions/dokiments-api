# Local development services.
#
# `./gradlew bootRun` starts the default services (Redis and the Firebase emulators)
# automatically through Spring Boot's Docker Compose support, connects to them, and stops
# them when the application stops. Nothing needs to be started by hand.
#
# To run the API itself as a container too, the way it runs when deployed:
#   docker compose --profile full up --build
#
# Image tags must stay in line with src/test/java/com/dokiments/support/TestImages.java,
# so that local development and integration tests use the same versions. The integration
# tests build the Firebase emulators image from the same folder (buildFirebaseEmulatorsImage).
#
# The ${...} values below can be changed in a .env file next to this one, which Docker
# Compose reads automatically. See .env.example for every setting and its default.

name: dokiments-api

services:
  redis:
    image: redis:8.10-alpine
    # Only the container port is listed, so Docker picks a free host port. Spring Boot
    # reads the actual port when it connects, and nothing clashes with other projects
    # that already use 6379.
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Firebase emulators: Auth (sign-up and sign-in), Firestore (the database) and the
  # Emulator UI to browse both, at http://localhost:4000. Built from docker/firebase-emulators,
  # once, on first use. The project ID is "demo-dokiments": a "demo-" ID can never match a
  # real Firebase project, so nothing here can reach Google.
  #
  # Their data is kept between restarts in the firebase-data volume: start.sh loads the last
  # save on start, saves regularly and once more on stop.
  firebase:
    image: dokiments-firebase-emulators:local
    build:
      context: docker/firebase-emulators
      secrets:
        - extra_ca
    volumes:
      - firebase-data:/data
    environment:
      SAVE_INTERVAL_SECONDS: ${FIRESTORE_SAVE_INTERVAL_SECONDS:-60}
      KEEP_SAVES: ${FIRESTORE_KEEP_SAVES:-3}
      FIRESTORE_PORT: ${FIRESTORE_EMULATOR_PORT:-8085}
      AUTH_PORT: ${AUTH_EMULATOR_PORT:-9099}
      UI_PORT: ${EMULATOR_UI_PORT:-4000}
      WEBSOCKET_PORT: ${FIRESTORE_WEBSOCKET_PORT:-9150}
      LOGGING_PORT: ${EMULATOR_LOGS_PORT:-4500}
    # Time for the final save before Docker force-stops the container.
    stop_grace_period: 30s
    # The same port inside the container as on the host, because the Emulator UI runs in the
    # browser and connects to each emulator at the port it listens on. Known ports also let
    # the application be pointed at them (FIRESTORE_EMULATOR_HOST); Spring Boot has no
    # built-in support for these emulators, so it can't discover random ports the way it
    # does for Redis.
    ports:
      - "${FIRESTORE_EMULATOR_PORT:-8085}:${FIRESTORE_EMULATOR_PORT:-8085}"
      - "${AUTH_EMULATOR_PORT:-9099}:${AUTH_EMULATOR_PORT:-9099}"
      - "${EMULATOR_UI_PORT:-4000}:${EMULATOR_UI_PORT:-4000}"
      - "${FIRESTORE_WEBSOCKET_PORT:-9150}:${FIRESTORE_WEBSOCKET_PORT:-9150}"
      - "${EMULATOR_LOGS_PORT:-4500}:${EMULATOR_LOGS_PORT:-4500}"
    labels:
      # Spring Boot would otherwise log that it found a service it doesn't recognise.
      org.springframework.boot.ignore: "true"
    healthcheck:
      # The emulators' coordinator, which answers once start.sh has started them.
      test: ["CMD", "curl", "-fsS", "http://localhost:4400/emulators"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Only started with `--profile full`. Built from the local Dockerfile and run with the
  # production profile, which makes it a close copy of a real deployment.
  api:
    profiles: ["full"]
    build:
      context: .
      secrets:
        - extra_ca
    environment:
      REDIS_URL: redis://redis:6379
      # The Compose emulator, with its "demo-" project ID, never a real project.
      FIREBASE_PROJECT_ID: demo-dokiments
      FIRESTORE_EMULATOR_HOST: firebase:${FIRESTORE_EMULATOR_PORT:-8085}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      firebase:
        condition: service_healthy

  # Optional trace viewer for local development: docker compose --profile tracing up -d
  # Then run the API with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 and open
  # http://localhost:16686. Traces are kept in memory only, until the container stops.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [tracing]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_PORT:-4318}:4318"
    labels:
      # Not one of the services the application connects to by itself.
      org.springframework.boot.ignore: "true"

secrets:
  # Optional root CA certificate for networks with a TLS-inspecting proxy (see the
  # Dockerfile). Set EXTRA_CA_PEM to the certificate's contents, for example
  #   EXTRA_CA_PEM="$(cat /path/to/proxy-root-ca.pem)" docker compose --profile full up --build
  # When it isn't set, the secret is empty and the build skips that step.
  #
  # The contents are passed rather than a file path on purpose: Compose builds through
  # Docker Bake, which refuses to read files outside the project without an extra
  # permission flag, and that would break the build on every machine.
  extra_ca:
    environment: EXTRA_CA_PEM

volumes:
  # Saved emulator data (Auth accounts and Firestore). Kept by `docker compose down`; removed,
  # for a fresh start, by `docker compose down --volumes`.
  firebase-data:
